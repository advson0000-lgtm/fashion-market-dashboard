<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>랭킹 수집 후 대시보드 보기</title><style>body{font-family:Arial,"Malgun Gothic",sans-serif;max-width:760px;margin:40px auto;padding:0 18px;background:#f4f1ec;color:#202522;line-height:1.6}section{background:#fffdf9;border:1px solid #ddd8cf;border-radius:14px;padding:20px;margin:16px 0}a{color:#1f5c4a;font-weight:700;margin-right:12px}code{background:#eee9e0;padding:2px 5px}</style></head><body><h1>랭킹 수집 → 대시보드 바로 보기</h1><p>북마크 버튼을 누르면 최대 50위를 CSV로 저장하고, 같은 브라우저의 대시보드에 즉시 표시합니다.</p><section><h2>북마크 추가</h2><p>아래 링크를 북마크바로 끌어놓으세요. 북마크바: <code>Ctrl + Shift + B</code></p><a id="collector" href="#">📊 저장 후 대시보드 보기</a></section><section><h2>사용 순서</h2><ol><li>무신사 랭킹 페이지를 엽니다.</li><li>상품 목록이 로딩될 때까지 기다립니다.</li><li>북마크바의 버튼을 클릭합니다.</li><li>CSV 다운로드와 함께 대시보드가 새 탭으로 열립니다.</li></ol><a href="https://www.musinsa.com/main/musinsa/ranking?skip_bf=Y&gf=A&storeCode=musinsa&sectionId=3307&contentsId=&categoryCode=000&ageBand=AGE_BAND_ALL" target="_blank">무신사 랭킹 열기</a></section><script>(function(){const run=async function(){const wait=m=>new Promise(r=>setTimeout(r,m));let old=0,same=0;for(let i=0;i<18;i++){scrollTo(0,document.body.scrollHeight);await wait(500);let h=document.body.scrollHeight;if(h===old)same++;else same=0;old=h;if(same>2)break}scrollTo(0,0);let rows=[],seen=new Set();document.querySelectorAll('a[href*="/products/"]').forEach(a=>{let m=a.href.match(/\/products\/(\d+)/);if(!m||seen.has(m[1]))return;let b=a;for(let i=0;i<8&&b.parentElement;i++){let t=(b.innerText||'').trim(),ls=b.querySelectorAll?.('a[href*="/products/"]')||[];if(ls.length===1&&t.length>20&&t.length<1200&&/원/.test(t))break;b=b.parentElement}let t=(b.innerText||'').replace(/\n+/g,' | '),price=(t.match(/([\d,]+)원/)||[])[1]||'',brand=[...b.querySelectorAll('a[href*="/brand/"]')][0]?.innerText?.trim()||'',p=(b.innerText||'').split(/\n+/).map(x=>x.trim()).find(x=>x.length>5&&x!==brand&&!x.includes('원')&&!/^판매/.test(x))||'상품 '+m[1];rows.push({platform:location.hostname.includes('musinsa')?'musinsa':location.hostname.includes('zigzag')?'zigzag':'ably',period:'daily',rank:String(rows.length+1),brand,product:p,category:'',price:price.replace(/,/g,''),collected_at:new Date().toISOString().slice(0,16).replace('T',' '),url:a.href});seen.add(m[1]);if(rows.length>=50)return});if(!rows.length){alert('상품을 찾지 못했습니다.');return}let k=Object.keys(rows[0]),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv='\ufeff'+[k.join(','),...rows.map(r=>k.map(x=>q(r[x])).join(','))].join('\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),d=document.createElement('a');d.href=u;d.download='rankings-'+rows[0].platform+'-top50-'+new Date().toISOString().slice(0,10)+'.csv';d.click();let w=open('https://advson0000-lgtm.github.io/fashion-market-dashboard/?rankings=local','_blank');setTimeout(()=>w?.postMessage({type:'fashion-rankings',rows},'*'),1500);alert(rows.length+'개 상품을 저장하고 대시보드로 보냈습니다.');};document.getElementById('collector').href='javascript:void (async()=>{'+run.toString().replace(/^async function\(\)\{/,'').replace(/\}$/,'')+'})()';})();</script></body></html>
